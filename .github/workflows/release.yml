# 推送 v* 标签时自动构建 release APK 并发布到 GitHub Release
#
# 需要先在仓库 Secrets 中配置（值见本地 keystore.properties）：
#   KEYSTORE_BASE64   = keystore/cannonremote-release.jks 的 base64 编码
#   KEYSTORE_PASSWORD = storePassword
#   KEY_ALIAS         = cannonremote
#   KEY_PASSWORD      = keyPassword
# 未配置签名 Secret 时仍会构建，只是产出未签名 APK。
#
# 触发方式：git tag v1.0.0 && git push origin v1.0.0
# 版本号自动从 tag 推导（versionName = tag 去 v 前缀；versionCode = 主*1e6+次*1e3+修订），
# 无需再手动改 app/build.gradle.kts。

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置签名 Secrets，将产出未签名 APK"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/cannonremote-release.jks
          printf 'storeFile=keystore/cannonremote-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK with tag
        run: cp app/build/outputs/apk/release/app-release.apk "CanonRemote-${{ github.ref_name }}.apk"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: CanonRemote-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
